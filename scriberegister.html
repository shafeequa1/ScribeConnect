<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Be a Scribe - Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h1>Be a Scribe</h1>

    <form>

        <h3>Personal Details</h3>
        <input type="text" placeholder="Full Name" required>
        <input type="number" placeholder="Age" required>

        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <input type="tel" placeholder="Contact Number" required>
        <input type="email" placeholder="Email ID" required>
        <input type="text" placeholder="City & State" required>

        <h3>Academic Details</h3>
        <input type="text" placeholder="College Name" required>
        <input type="text" placeholder="Course / Stream" required>
        <input type="text" placeholder="Year of Study" required>
        <input type="text" placeholder="Percentage / GPA" required>

        <h3>Scribe Experience</h3>
        <select required>
            <option value="">Worked as Scribe Before?</option>
            <option>Yes</option>
            <option>No</option>
        </select>

        <input type="text" placeholder="Subjects Comfortable Writing">
        <input type="text" placeholder="Languages Known">
        <input type="file" placeholder="Upload College ID">

        <button type="submit" class="btn">Submit Registration</button>

    </form>
</div>

</body>
</html>
