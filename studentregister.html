<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find a Scribe - Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h1>Find a Scribe</h1>

    <!-- Updated form -->
    <form onsubmit="goToScribeList(event)">

        <h3>Personal Details</h3>
        <input type="text" placeholder="Full Name" required>
        <input type="number" placeholder="Age" required>
        
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <input type="tel" placeholder="Contact Number" required>
        <input type="email" placeholder="Email ID" required>
        <input type="text" placeholder="City & State" required>

        <h3>Academic Details</h3>
        <input type="text" placeholder="College / Institution Name" required>
        <input type="text" placeholder="Course / Stream" required>
        <input type="text" placeholder="Year of Study" required>
        <input type="text" placeholder="Percentage / GPA" required>

        <h3>Exam Details</h3>
        <input type="text" placeholder="Subject Name" required>
        <input type="date" required>
        <input type="time" required>
        <input type="text" placeholder="Exam Center Location" required>

        <h3>Additional Details</h3>
        <textarea placeholder="Special Instructions (if any)"></textarea>
        <input type="file">

        <button type="button" class="btn" onclick="window.location.href='scribelist.html'">
    Submit Registration
</button>


    </form>
</div>

<!-- Script added for redirect -->
<script>
function goToScribeList(event) {
    event.preventDefault();   // Prevent form reload
    window.location.href = "scribe-list.html";  // Go to scribe list page
}
</script>

</body>
</html>
